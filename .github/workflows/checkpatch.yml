name: checkpatch review
on: [pull_request]

permissions:
  contents: read

jobs:
  my_review:
    name: checkpatch review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Download latest checkpatch.pl from kernel tree
        run: |
          mirrors=(
            "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git/plain/scripts"
            "https://raw.githubusercontent.com/torvalds/linux/master/scripts"
          )
          # Mirrors may answer HTTP 200 with an HTML anti-bot challenge, so
          # validate the content and treat anything unexpected as a failure.
          validate() {
            local name="$1" file="$2"
            [ -s "$file" ] || return 1
            case "$name" in
              checkpatch.pl)
                [ "$(head -n1 "$file")" = '#!/usr/bin/env perl' ] &&
                  perl -c "$file" >/dev/null 2>&1 ;;
              spelling.txt)
                grep -q '||' "$file" &&
                  ! grep -qvE '^(#.*|[^|]+\|\|[^|]+)?$' "$file" ;;
              const_structs.checkpatch)
                ! grep -qvE '^[A-Za-z_][A-Za-z0-9_]*$' "$file" ;;
              *) return 1 ;;
            esac
          }
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for f in checkpatch.pl spelling.txt const_structs.checkpatch; do
            for base in "${mirrors[@]}"; do
              if curl -fsSL --retry 3 "${base}/${f}" -o "$tmp"; then
                if validate "$f" "$tmp"; then
                  mv "$tmp" "$GITHUB_WORKSPACE/${f}"
                  continue 2
                fi
                echo "::warning::Invalid content for ${f} from ${base} (possible anti-bot page)"
              else
                echo "::warning::Failed to fetch ${f} from ${base}"
              fi
            done
            echo "::error::Unable to download ${f} from any mirror"
            exit 1
          done
          chmod +x "$GITHUB_WORKSPACE/checkpatch.pl"
      - name: Run checkpatch review
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # FILE_PATH_CHANGES only prompts to update MAINTAINERS, which this
          # repository does not maintain. FSF_MAILING_ADDRESS also matches
          # required wording in the verbatim GPLv2 license text.
          git fetch --no-tags --prune origin "${BASE_REF}"
          MERGE_BASE="$(git merge-base "origin/${BASE_REF}" "${HEAD_SHA}")"
          ./checkpatch.pl --no-tree --show-types \
            --ignore FILE_PATH_CHANGES,FSF_MAILING_ADDRESS \
            --git "${MERGE_BASE}..${HEAD_SHA}"